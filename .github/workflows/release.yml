name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'ConfigurationFrom1Password/**'
      
permissions:
  id-token: write
  contents: read
  
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ConfigurationFrom1Password.sln

      - name: Build
        run: dotnet build ConfigurationFrom1Password.sln --no-restore --configuration Release

      - name: Pack
        run: dotnet pack ConfigurationFrom1Password/ConfigurationFrom1Password.csproj --no-build --configuration Release --output ./nupkgs
        
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
